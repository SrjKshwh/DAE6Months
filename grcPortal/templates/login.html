<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}GRC Portal – Login{% endblock %}

{% block content %}
<div class="login-container">
    <!-- Background image covers entire screen -->
    <div class="login-bg"></div>
    
    <!-- Login card positioned on the right -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-4">
                <h1 class="text-primary"><i class="fas fa-shield-alt"></i> GRC Portal</h1>
                <p class="text-muted">Secure Governance, Risk, and Compliance Management</p>
            </div>

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h5 class="mb-0"><i class="fas fa-sign-in-alt"></i> Login to Your Account</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email"
                                       required placeholder="admin@example.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       required placeholder="Enter your password">
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <p class="mb-0">Don't have an account?
                        <a href="{{ url_for('register') }}" class="text-decoration-none">
                            <strong>Create new user</strong>
                        </a>
                    </p>
                </div>
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">
                    <i class="fas fa-info-circle"></i>
                    Default admin credentials: admin@example.com / admin123
                </small>
            </div>
        </div>
    </div>
</div>

<style>
.login-container {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
}

.login-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('/static/images/cybersecurityBG.png') no-repeat center center;
    background-size: cover;
    z-index: -1;
}

.login-wrapper {
    display: flex;
    align-items: center;
    justify-content: flex-end; /* Pushes to the right */
    min-height: 100vh;
    padding: 2rem;
}

.login-card {
    background-color: rgba(13, 27, 42, 0.04); /* Dark blue similar to cybersecurity theme */
    border-radius: 15px;
    padding: 2rem;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    max-width: 400px;
    width: 100%;
}

.card {
    border: none;
    border-radius: 15px;
    background-color: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(10px);
}

.card-header {
    border-radius: 15px 15px 0 0 !important;
    background-color: rgba(0, 123, 255, 0.9) !important;
}

.input-group-text {
    background-color: rgba(248, 249, 250, 0.8);
    border-color: rgba(222, 226, 230, 0.8);
}

/* Mobile responsive */
@media (max-width: 768px) {
    .login-wrapper {
        justify-content: center; /* Center on mobile */
        padding: 1rem;
    }
    
    .login-card {
        background-color: rgba(13, 27, 42, 0.9);
        margin: 1rem;
        padding: 1rem;
        max-width: none;
    }
}
</style>
{% endblock %}
