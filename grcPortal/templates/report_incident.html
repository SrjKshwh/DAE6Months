<!-- templates/report_incident.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GRC Portal – Report Incident</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Report New Incident</h1>
      <a href="{{ url_for('incidents') }}">Back to Incidents</a> | <a href="{{ url_for('logout') }}">Logout</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash">
          {% for cat, msg in messages %}
            <div class="flash-{{ cat }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="card">
      <form method="POST">
        <label for="title">Title:</label>
        <input type="text" name="title" required><br><br>

        <label for="description">Description:</label>
        <textarea name="description" required></textarea><br><br>

        <label for="severity">Severity:</label>
        <select name="severity">
          {% for sev in severities %}
            <option value="{{ sev.value }}">{{ sev.value }}</option>
          {% endfor %}
        </select><br><br>

        <button type="submit">Report Incident</button>
      </form>
    </div>
  </div>
</body>
</html>
