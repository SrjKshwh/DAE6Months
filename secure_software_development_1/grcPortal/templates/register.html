<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create New User</title>
  <script>
    function validateForm(event) {
      const email = document.forms["regForm"]["email"].value.trim();
      const password = document.forms["regForm"]["password"].value;
      const confirmPassword = document.forms["regForm"]["confirm_password"].value;
      const errorBox = document.getElementById("errorBox");
      errorBox.innerHTML = ""; // clear previous errors

      // Email regex
      const emailPattern = /^[\w\.-]+@[\w\.-]+\.\w+$/;
      if (!emailPattern.test(email)) {
        errorBox.innerHTML = "❌ Invalid email format!";
        event.preventDefault();
        return false;
      }

      // Password rules
      if (password.length < 8) {
        errorBox.innerHTML = "❌ Password must be at least 8 characters long.";
        event.preventDefault();
        return false;
      }
      if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
        errorBox.innerHTML = "❌ Password must contain at least one letter and one number.";
        event.preventDefault();
        return false;
      }

      // Confirm password check
      if (password !== confirmPassword) {
        errorBox.innerHTML = "❌ Passwords do not match.";
        event.preventDefault();
        return false;
      }

      return true; // allow submission
    }
  </script>
</head>
<body>
  <h2>Register New User</h2>
  <form name="regForm" method="POST" action="{{ url_for('register') }}" onsubmit="return validateForm(event)">
    <label>Email:</label><br>
    <input type="text" name="email" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <label>Confirm Password:</label><br>
    <input type="password" name="confirm_password" required><br><br>

    <button type="submit">Register</button>
  </form>

  <p id="errorBox" style="color:red; font-weight:bold;"></p>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}
</body>
</html>
