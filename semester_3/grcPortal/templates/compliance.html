<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compliance Records</title>
</head>
<body>
    <h2>Compliance Records</h2>

    <form method="POST" action="{{ url_for('add_compliance') }}">
        <label>Framework:</label>
        <input type="text" name="framework" placeholder="e.g., NIST CSF">

        <label>Control:</label>
        <input type="text" name="control" placeholder="e.g., AC-1 Access Control">

        <label>Score:</label>
        <input type="number" step="0.01" name="score" placeholder="0-100">

        <label>Related Risk ID (optional):</label>
        <input type="number" name="risk_id">

        <button type="submit">Add Compliance</button>
    </form>

    <h3>Compliance Records List</h3>
    <ul>
        {% for c in compliance %}
            <li>
                {{ c.framework }} | Control: {{ c.control }} | Score: {{ c.score }}%
                {% if c.risk %}
                    (Linked to Risk: {{ c.risk.asset }})
                {% endif %}
            </li>
        {% endfor %}
    </ul>

    <p><a href="{{ url_for('risks') }}">← Back to Risks</a></p>
</body>
</html>
