<!-- risks.html -->
<h2>Risk Register</h2>
<form method="POST" action="{{ url_for('add_risk') }}">
  <input name="asset" placeholder="Asset">
  <input name="threat" placeholder="Threat">
  <input name="vulnerability" placeholder="Vulnerability">
  <input name="control" placeholder="Control">
  <input name="likelihood" type="number" min="1" max="5">
  <input name="impact" type="number" min="1" max="5">
  <button type="submit">Add Risk</button>
</form>

<ul>
  {% for risk in risks %}
    <li>{{ risk.asset }} | Score: {{ risk.score }} | Status: {{ risk.status }}</li>
  {% endfor %}
</ul>
