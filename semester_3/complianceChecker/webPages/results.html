<!DOCTYPE html>
<html>
<head>
    <title>Compliance Report</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Detected Risks</h2>
    <table>
        <tr><th>Risk</th><th>Severity</th></tr>
        {% for item in risks %}
        <tr>
            <td>{{ item.risk }}</td>
            <td>{{ item.severity }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Risk Severity Heatmap</h2>
    <div>
        {{ heatmap|safe }}
    </div>

    <a href="/">← Upload another file</a>
</body>
</html>
